# Configuración general
spring.application.name=empoderat-api
server.port=8080
server.servlet.context-path=/
spring.main.allow-bean-definition-overriding=true

# Configuración MySQL (entidades principales)
spring.datasource.mysql.jdbc-url=jdbc:mysql://localhost:3306/empoderat?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.mysql.username=root
spring.datasource.mysql.password=root
spring.datasource.mysql.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración MongoDB (recursos y logs)
spring.data.mongodb.uri=mongodb://localhost:27017/empoderat
spring.data.mongodb.auto-index-creation=true

# Configuración Neo4J (relaciones y progreso)
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=password

# Configuración JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# Configuración Keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/auth/realms/empoderat
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs
keycloak.realm=empoderat
keycloak.auth-server-url=http://localhost:8180/auth
keycloak.ssl-required=external
keycloak.resource=empoderat-backend
keycloak.credentials.secret=tu-secreto-keycloak
keycloak.use-resource-role-mappings=true
keycloak.bearer-only=true

# Configuración JWT (para el servicio mock de autenticación)
jwt.secret=cGlwaWx1Y2hhc3BpcGlsdWNoYXNwaXBpbHVjaGFzcGlwaWx1Y2hhc3BpcGlsdWNoYXNwaXBp
jwt.expiration=86400000

# Configuración CORS
cors.allowed-origins=*
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.exposed-headers=Authorization
cors.max-age=3600

# Configuración Logging
logging.level.org.springframework=INFO
logging.level.com.empoderat=DEBUG