# Configuración general
spring.application.name=empoderat-api
server.port=8080
server.servlet.context-path=/
spring.main.allow-bean-definition-overriding=true

# Configuración MySQL (entidades principales)
spring.datasource.mysql.jdbc-url=jdbc:mysql://localhost:3306/empoderat?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.mysql.username=root
spring.datasource.mysql.password=root
spring.datasource.mysql.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración MongoDB (recursos y logs)
spring.data.mongodb.uri=mongodb+srv://root:root@empoderat.cwi1qm7.mongodb.net/empoderat?retryWrites=true&w=majority&appName=EmpoderaT
spring.data.mongodb.auto-index-creation=true

# Configuración Neo4J (relaciones y progreso)
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=password

# Configuración JWT
jwt.secret=TuClaveSecretaAquiDebeSerLargaYSegura123!@#$%^&*()_+=
jwt.expiration=86400000

# Configuración JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# Configuración Keycloak OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/empoderat
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/empoderat/protocol/openid-connect/certs

# Configuración Keycloak Client
keycloak.realm=empoderat
keycloak.auth-server-url=http://localhost:8180
keycloak.resource=empoderat-backend
keycloak.credentials.secret=lA4VaiKZKaBtAz9T8YJcBIbRDU80p8oG
keycloak.public-client=false

# Configuración CORS
cors.allowed-origins=http://localhost:5173
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=Authorization,Content-Type,X-Auth-Token
cors.exposed-headers=Authorization
cors.max-age=3600

# Configuración Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.com.empoderat=DEBUG
logging.level.org.keycloak=DEBUG

# Activar perfil de desarrollo
spring.profiles.active=dev

# Configuración para uploads
app.upload.dir=uploads
app.base.url=http://localhost:8080

# Tamaño máximo para uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.enabled=true
