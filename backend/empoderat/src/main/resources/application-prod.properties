# ===================================
# CONFIGURACIÓN DE PRODUCCIÓN
# ===================================

# Configuración general
spring.application.name=empoderat-api
server.port=8080
server.servlet.context-path=/
spring.main.allow-bean-definition-overriding=true

# Configuración MySQL (entidades principales)
spring.datasource.mysql.jdbc-url=${SPRING_DATASOURCE_MYSQL_JDBC_URL}
spring.datasource.mysql.username=${SPRING_DATASOURCE_MYSQL_USERNAME}
spring.datasource.mysql.password=${SPRING_DATASOURCE_MYSQL_PASSWORD}
spring.datasource.mysql.driver-class-name=${SPRING_DATASOURCE_MYSQL_DRIVER_CLASS_NAME}

# Configuración MongoDB (recursos y logs)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# Configuración Neo4J (relaciones y progreso)
spring.neo4j.uri=${SPRING_NEO4J_URI}
spring.neo4j.authentication.username=${SPRING_NEO4J_AUTHENTICATION_USERNAME}
spring.neo4j.authentication.password=${SPRING_NEO4J_AUTHENTICATION_PASSWORD}

# Configuración JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Configuración JPA (Producción - más conservadora)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Configuración Keycloak OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_URL}/realms/empoderat
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_URL}/realms/empoderat/protocol/openid-connect/certs

# Configuración Keycloak Client
keycloak.realm=empoderat
keycloak.auth-server-url=${KEYCLOAK_URL}
keycloak.resource=empoderat-backend
keycloak.credentials.secret=${KEYCLOAK_CLIENT_SECRET}
keycloak.public-client=false

# Configuración CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=Authorization,Content-Type,X-Auth-Token
cors.exposed-headers=Authorization
cors.max-age=3600

# Configuración Logging (Producción - menos verbose)
logging.level.org.springframework.security=WARN
logging.level.org.springframework.security.oauth2=WARN
logging.level.com.empoderat=INFO
logging.level.org.keycloak=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# Perfil activo

# Configuración para uploads
app.upload.dir=${APP_UPLOAD_DIR:/app/uploads}
app.base.url=${APP_BASE_URL}

# Tamaño máximo para uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.enabled=true

# Configuraciones adicionales de producción
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Pool de conexiones optimizado
spring.jpa.properties.hibernate.connection.pool_size=20
spring.jpa.properties.hibernate.connection.autocommit=false

# Cache de segundo nivel (opcional)
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
