version: '3.8'

services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.2
    container_name: keycloak-empoderat
    ports:
      - "8180:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=dev-file
      # Ya no es necesario preview ni scripts ni authorization
    command:
      - start-dev
      - --import-realm
    volumes:
      - keycloak_data:/opt/keycloak/data
      # Monta tu JSON limpio (sin authorizationSettings)
      - ./realm-export.json:/opt/keycloak/data/import/realm.json:ro

volumes:
  keycloak_data:
